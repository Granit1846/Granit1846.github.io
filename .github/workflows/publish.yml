# Builds the LogBook Mini App from Granit1846/logbook-site and serves it here:
# *.vercel.app is unreachable from Russian networks, github.io is not.
name: Publish Mini App

on:
  workflow_dispatch:
  # shortcut: polls instead of a cross-repo trigger (that needs a token); switch to repository_dispatch if 30 min is too slow.
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write
  # needed to delete artifacts left behind by earlier attempts of the same run
  actions: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  ARTIFACT_NAME: github-pages

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: Granit1846/logbook-site
          sparse-checkout: |
            /*
            !/public/downloads/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      # Hash routing only; 404.html keeps deep links working, .nojekyll serves files as they are.
      - run: cp dist/index.html dist/404.html && touch dist/.nojekyll

      # "Re-run jobs" keeps the artifacts of the previous attempts on the same run, while
      # deploy-pages expects exactly one artifact with this name in the run.
      # Without this, the second re-run dies with
      #   Multiple artifacts named "github-pages" were unexpectedly found ... count is 2.
      - name: Drop artifacts left by earlier attempts of this run
        if: github.run_attempt > 1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts"
          curl -sfL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            "${api}?per_page=100" \
            | jq -r --arg name "${ARTIFACT_NAME}" '.artifacts[] | select(.name==$name) | .id' \
            | while read -r id; do
                echo "deleting stale artifact ${id}"
                curl -sfL -X DELETE -H "Authorization: Bearer ${GH_TOKEN}" \
                  "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}"
              done

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      # deploy-pages does not read the public REST artifacts API. It lists artifacts through
      # @actions/artifact against the internal results service (ACTIONS_RESULTS_URL), and
      # that index trails the finished upload by a second or two. deploy-pages asks exactly
      # once, so the scheduled run on 2026-11-22 16:30Z died with
      #   No artifacts named "github-pages" were found for this workflow run
      # although the artifact was already there and visible over REST.
      # Poll the very same service deploy-pages uses until it agrees, so its single-shot
      # question is already answered by the time it runs.
      - name: Wait until deploy-pages can see the artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rest_api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts"

          count_via_results_service() {
            curl -sf --max-time 20 -X POST \
              "${ACTIONS_RESULTS_URL%/}/twirp/github.actions.results.api.v1.ArtifactService/ListArtifacts" \
              -H "Authorization: Bearer ${ACTIONS_RUNTIME_TOKEN}" \
              -H "Content-Type: application/json" \
              -d '{}' \
              | jq -r --arg name "${ARTIFACT_NAME}" '[(.artifacts // [])[] | select(.name==$name)] | length' \
              || echo 0
          }

          count_via_rest() {
            curl -sfL --max-time 20 -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" "${rest_api}?per_page=100" \
              | jq -r --arg name "${ARTIFACT_NAME}" '[(.artifacts // [])[] | select(.name==$name)] | length' \
              || echo 0
          }

          # The token above is normally exposed to run steps on GitHub-hosted runners.
          # If it ever is not, fall back to the REST API plus a fixed settle delay.
          if [ -z "${ACTIONS_RESULTS_URL:-}" ] || [ -z "${ACTIONS_RUNTIME_TOKEN:-}" ]; then
            echo "::warning::ACTIONS_RESULTS_URL or ACTIONS_RUNTIME_TOKEN is not exposed to run steps; falling back to a fixed settle delay"
            for attempt in $(seq 1 30); do
              count=$(count_via_rest)
              echo "poll ${attempt}: ${count} artifact(s) named ${ARTIFACT_NAME} visible (REST)"
              if [ "${count}" -ge 1 ]; then break; fi
              sleep 2
            done
            sleep 15
            exit 0
          fi

          # Two consecutive clean readings: a single one can catch the index mid-update.
          clean=0
          for attempt in $(seq 1 45); do
            count=$(count_via_results_service)
            echo "poll ${attempt}: ${count} artifact(s) named ${ARTIFACT_NAME} visible to the results service"
            if [ "${count}" -eq 1 ]; then clean=$((clean + 1)); else clean=0; fi
            if [ "${clean}" -ge 2 ]; then exit 0; fi
            sleep 2
          done
          echo "::error::the results service never reported exactly one ${ARTIFACT_NAME} artifact"
          exit 1

      - id: deployment
        uses: actions/deploy-pages@v5
