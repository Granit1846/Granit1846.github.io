# Builds the LogBook Mini App from Granit1846/logbook-site and serves it here:
# *.vercel.app is unreachable from Russian networks, github.io is not.
name: Publish Mini App

on:
  workflow_dispatch:
  # shortcut: polls instead of a cross-repo trigger (that needs a token); switch to repository_dispatch if 30 min is too slow.
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: Granit1846/logbook-site
          sparse-checkout: |
            /*
            !/public/downloads/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      # Hash routing only; 404.html keeps deep links working, .nojekyll serves files as they are.
      - run: cp dist/index.html dist/404.html && touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
