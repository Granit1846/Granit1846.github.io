# Builds the LogBook Mini App from Granit1846/logbook-site and serves it here:
# *.vercel.app is unreachable from Russian networks, github.io is not.
name: Publish Mini App

on:
  workflow_dispatch:
  # shortcut: polls instead of a cross-repo trigger (that needs a token); switch to repository_dispatch if 30 min is too slow.
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write
  # needed to delete artifacts left behind by earlier attempts of the same run
  actions: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  ARTIFACT_NAME: github-pages

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: Granit1846/logbook-site
          sparse-checkout: |
            /*
            !/public/downloads/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      # Hash routing only; 404.html keeps deep links working, .nojekyll serves files as they are.
      - run: cp dist/index.html dist/404.html && touch dist/.nojekyll

      # "Re-run jobs" keeps the artifacts of the previous attempts on the same run, while
      # deploy-pages expects exactly one artifact with this name in the run.
      # Without this, the second re-run dies with
      #   Multiple artifacts named "github-pages" were unexpectedly found ... count is 2.
      - name: Drop artifacts left by earlier attempts of this run
        if: github.run_attempt > 1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts"
          curl -sfL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            "${api}?per_page=100" \
            | jq -r --arg name "${ARTIFACT_NAME}" '.artifacts[] | select(.name==$name) | .id' \
            | while read -r id; do
                echo "deleting stale artifact ${id}"
                curl -sfL -X DELETE -H "Authorization: Bearer ${GH_TOKEN}" \
                  "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}"
              done

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      # deploy-pages does not read the public REST artifacts API. It lists artifacts through
      # @actions/artifact against the internal results service (ACTIONS_RESULTS_URL), and
      # that index trails the finished upload by a second or two. deploy-pages asks exactly
      # once, so the scheduled run on 2026-11-22 16:30Z died with
      #   No artifacts named "github-pages" were found for this workflow run
      # although the artifact was already there and visible over REST.
      # Ask the very same service deploy-pages uses, so its single-shot question is already
      # answered by the time it runs. This runs as a JS action (github-script) because only
      # JS actions get ACTIONS_RESULTS_URL and ACTIONS_RUNTIME_TOKEN in their environment;
      # a plain `run:` step does not.
      - name: Wait until deploy-pages can see the artifact
        uses: actions/github-script@v9
        with:
          script: |
            const name = 'github-pages'
            const base = (process.env.ACTIONS_RESULTS_URL || '').replace(/\/+$/, '')
            const token = process.env.ACTIONS_RUNTIME_TOKEN
            const sleep = ms => new Promise(resolve => setTimeout(resolve, ms))

            if (!base || !token) {
              core.warning('ACTIONS_RESULTS_URL/ACTIONS_RUNTIME_TOKEN are missing; sleeping instead of polling')
              await sleep(20000)
              return
            }

            const deadline = Date.now() + 90000
            let clean = 0
            while (Date.now() < deadline) {
              let count = -1
              try {
                const res = await fetch(`${base}/twirp/github.actions.results.api.v1.ArtifactService/ListArtifacts`, {
                  method: 'POST',
                  headers: { Authorization: `Bearer ${token}`, 'Content-Type': 'application/json' },
                  body: '{}'
                })
                if (res.ok) {
                  const body = await res.json()
                  count = (body.artifacts || []).filter(a => a.name === name).length
                  core.info(`${count} artifact(s) named ${name} visible to the results service`)
                } else {
                  core.info(`ListArtifacts responded HTTP ${res.status}`)
                }
              } catch (error) {
                core.info(`ListArtifacts request failed: ${error.message}`)
              }
              if (count === 1) { clean += 1 } else { clean = 0 }
              if (clean >= 2) {
                core.info('artifact is indexed, handing over to deploy-pages')
                return
              }
              await sleep(2000)
            }
            core.setFailed(`the results service never reported exactly one ${name} artifact`)

      - id: deployment
        uses: actions/deploy-pages@v5
