# Builds the LogBook Mini App from Granit1846/logbook-site and serves it here:
# *.vercel.app is unreachable from Russian networks, github.io is not.
name: Publish Mini App

on:
  workflow_dispatch:
  # shortcut: polls instead of a cross-repo trigger (that needs a token); switch to repository_dispatch if 30 min is too slow.
  schedule:
    - cron: '*/30 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write
  # needed to delete artifacts left behind by earlier attempts of the same run
  actions: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  ARTIFACT_NAME: github-pages

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy_attempt1.outputs.page_url || steps.deploy_attempt2.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: Granit1846/logbook-site
          sparse-checkout: |
            /*
            !/public/downloads/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
      # Hash routing only; 404.html keeps deep links working, .nojekyll serves files as they are.
      - run: cp dist/index.html dist/404.html && touch dist/.nojekyll

      # "Re-run jobs" keeps the artifacts of the previous attempts on the same run, while
      # deploy-pages expects exactly one artifact with this name in the run.
      # Without this, the second re-run dies with
      #   Multiple artifacts named "github-pages" were unexpectedly found ... count is 2.
      - name: Drop artifacts left by earlier attempts of this run
        if: github.run_attempt > 1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts"
          curl -sfL -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" \
            "${api}?per_page=100" \
            | jq -r --arg name "${ARTIFACT_NAME}" '.artifacts[] | select(.name==$name) | .id' \
            | while read -r id; do
                echo "deleting stale artifact ${id}"
                curl -sfL -X DELETE -H "Authorization: Bearer ${GH_TOKEN}" \
                  "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}"
              done

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      # deploy-pages asks the artifact service exactly once, and that index can trail the
      # finished upload by a second or two. That race killed the scheduled runs of
      # 2026-11-21 15:44Z ("No artifacts named github-pages were found") and
      # 2026-11-22 16:30Z — in the second one the public REST artifacts API already
      # reported the artifact 0.7 s before deploy-pages saw an empty list.
      # deploy-pages reads an internal service, not the REST API: no token for it is
      # available to a run step, and actions/github-script gets a token the endpoint
      # rejects with HTTP 401. So do not guess at that index at all — just ask
      # deploy-pages again after a pause. A failed first attempt stops before touching Pages.
      - id: deploy_attempt1
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Pause before retrying the deployment
        if: steps.deploy_attempt1.outcome == 'failure'
        run: sleep 20

      - id: deploy_attempt2
        if: steps.deploy_attempt1.outcome == 'failure'
        uses: actions/deploy-pages@v5
